services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    # No ports published by default. For local standalone access, uncomment:
    # ports:
    #   - "6333:6333"

volumes:
  qdrant-data:
